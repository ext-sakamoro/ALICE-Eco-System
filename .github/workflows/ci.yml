name: CI

on:
  push:
    branches: [main, 'ci/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  docs:
    name: Docs and crate index (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      - name: Crate index (README tables match docs/crate-index.tsv)
        run: python scripts/readme_index.py --check
      - name: Lock git revisions (tests)
        run: python scripts/test_lock_git_revs.py

  test:
    name: Test (public siblings)
    runs-on: ubuntu-latest
    env:
      # the passed-test count of the feature set below at the commit that set it;
      # fewer passed tests (a removed or skipped test, or none at all) is a failure
      MIN_PASSED: "1913"
    steps:
      # every alice-* comes by git (branch main + version); Cargo.lock records the commits
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (lib, integration, doctests)
        run: |
          # the default shell has no pipefail: without it cargo's exit status is lost in the pipe
          set -o pipefail
          log="$(mktemp)"
          cargo test --locked 2>&1 | tee "${log}"
          passed=$(grep -E '^test result: ' "${log}" | awk '{s += $4} END {print s + 0}')
          failed=$(grep -E '^test result: ' "${log}" | awk '{s += $6} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED}), failed: ${failed}"
          if [ "${failed}" -ne 0 ] || grep -E '^test result: ' "${log}" | grep -vE '^test result: ok\. ' >/dev/null; then
            echo "::error::${failed} tests failed"
            exit 1
          fi
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi
      - name: Lock (each alice-* git package from one revision)
        # after cargo test, so the lock checked is the one the build used
        run: python3 scripts/lock_git_revs.py Cargo.lock
      - name: Lock (every alice-* from git branch main, none by path, registry, rev or tag, one alice-det-math)
        run: |
          python3 - <<'PY'
          import sys, tomllib
          pk = [p for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"].startswith("alice")]
          # a sibling that pins an alice-* by rev or tag brings a second generation of it into this build
          bad = [f'{p["name"]} {p["version"]} {p.get("source", "path")}' for p in pk
                 if p["name"] != "alice-eco-system"
                 and not (p.get("source", "").startswith("git+") and "?branch=main#" in p.get("source", ""))]
          dm = [p for p in pk if p["name"] == "alice-det-math"]
          print(f"lock: {len(pk)} alice-* packages, {len(bad)} not from git branch main, {len(dm)} alice-det-math")
          if len(pk) < 2 or bad or len(dm) != 1:
              sys.exit("\n".join(bad) or "expected alice-* packages and exactly one alice-det-math")
          PY
      - name: alice-dup-check (checker tests)
        run: python3 scripts/alice_dup_check.py --self-test
      - name: alice-dup-check (one copy of each alice-* in this build)
        run: python3 scripts/alice_dup_check.py .
