[package]
name = "alice-eco-system"
version = "0.3.4"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Index of the public ALICE crates and the integration hub that connects them"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-Eco-System"

[dependencies]
# ALICE Ecosystem (Python bindings disabled for integration demo)
alice-edge = { path = "../ALICE-Edge", features = ["std"] }
alice-db = { path = "../ALICE-DB", default-features = false }
libasp = { path = "../ALICE-Streaming-Protocol", default-features = false }
alice-view = { path = "../ALICE-View" }

# 3D Asset Delivery Pipeline
alice-sdf = { path = "../ALICE-SDF", default-features = false, features = ["destruction"] }
alice-cdn = { path = "../ALICE-CDN", features = ["content_types"] }
alice-cache = { path = "../ALICE-Cache" }

# Game Engine Pipeline
alice-physics = { path = "../ALICE-Physics" }
alice-sync = { path = "../ALICE-Sync", features = ["telemetry"] }

# Crate bridges (Synth, VCS, Motion, RTOS, Kinematics, Font)
alice-synth = { path = "../ALICE-Synth", features = ["std"] }
alice-kinematics = { path = "../ALICE-Kinematics", features = ["std", "encoder"] }
alice-motion = { path = "../ALICE-Motion", features = ["std"] }
alice-rtos = { path = "../ALICE-RTOS" }
alice-vcs = { path = "../ALICE-VCS", features = ["std"] }

# Media & Text Processing bridges
alice-voice = { path = "../ALICE-Voice", default-features = false, features = ["std"] }
alice-codec = { path = "../ALICE-Codec", default-features = false, features = ["std"] }
alice-text = { path = "../ALICE-Text", default-features = false }
alice-search = { path = "../ALICE-Search", default-features = false, features = ["std"] }

# AI & GPU Inference bridges
alice-ml = { path = "../ALICE-ML", default-features = false, features = ["std"] }
alice-trt = { path = "../ALICE-TRT", default-features = false }

# Network & Security bridges
alice-dns = { path = "../ALICE-DNS", default-features = false }
alice-api = { path = "../ALICE-API", default-features = false, features = ["std"] }
# crates.io core crate (lib name aliased to `alice_core` as used by bridge_zip.rs); the
# `libalice` path dep broke when that package was renamed `alice-zip-cli` (0.4.0)
alice_core = { package = "alice-zip", version = "0.5", default-features = false, features = ["std", "lzma"] }

# Auth & Crypto bridges
alice-auth = { path = "../ALICE-Auth", default-features = false, features = ["std"] }
alice-crypto = { path = "../ALICE-Crypto" }

# Content Creation bridges (Animation, Manga, Print) — Proprietary, optional

# Container & Commercial bridges
alice-container = { path = "../ALICE-Container", default-features = false, features = ["std"] }

# Browser & Cloud Gateway bridges
alice-browser = { path = "../ALICE-Browser", default-features = false }
alice-cloud-gateway = { path = "../ALICE-Cloud-Gateway", default-features = false }

# Firewall bridge (Linux only — depends on nfq/netfilter)

# Tokenizer bridge
alice-token = { path = "../ALICE-Token" }

# Semantic Telemetry bridge

# Training bridge
alice-train = { path = "../ALICE-Train" }

# Telemetry & Messaging bridges
alice-analytics = { path = "../ALICE-Analytics", default-features = false, features = ["std"] }
alice-queue = { path = "../ALICE-Queue" }

# Financial domain bridges
alice-ledger = { path = "../ALICE-Ledger" }
alice-risk = { path = "../ALICE-Risk" }
alice-fix = { path = "../ALICE-FIX" }
alice-settlement = { path = "../ALICE-Settlement" }

# Science & Domain-Specific bridges (Path L-Q)
alice-bio = { path = "../ALICE-Bio" }
alice-legal = { path = "../ALICE-Legal" }
alice-energy = { path = "../ALICE-Energy" }
alice-space = { path = "../ALICE-Space" }
alice-climate = { path = "../ALICE-Climate" }

# Advanced domain bridges (Path R-U)
alice-history = { path = "../ALICE-History" }
alice-presence = { path = "../ALICE-Presence" }

# Hardware bridge
alice-bridge = { path = "../ALICE-Bridge" }

# Infrastructure bridges

# Data/Communication bridges

# Security bridges
alice-browser-secure = { path = "../ALICE-Browser-Secure", default-features = false }
alice-datashield = { path = "../ALICE-DataShield", default-features = false }

# Analytics/Monitoring bridges

# Domain bridges
alice-legal-ai = { path = "../ALICE-Legal-AI", default-features = false }

# Media/Compression/Low-level bridges
alice-text-compression = { path = "../ALICE-Text-Compression", default-features = false }

# Enterprise/Commercial bridges
alice-simd = { path = "../ALICE-SIMD", default-features = false, features = ["std"] }

# Media bridges (2026-03 batch)
alice-audio = { path = "../ALICE-Audio", default-features = false }
alice-video = { path = "../ALICE-Video", default-features = false }
alice-camera = { path = "../ALICE-Camera", default-features = false }

# Spatial bridges (2026-03 batch)
alice-navigation = { path = "../ALICE-Navigation", default-features = false }

# Optimization bridges (2026-03 batch)

# Real-time bridges (2026-03 batch)

# Compiler/Language bridges (2026-03 batch)
alice-compiler = { path = "../ALICE-Compiler", default-features = false }
alice-vm = { path = "../ALICE-VM", default-features = false }
alice-parser = { path = "../ALICE-Parser", default-features = false }

# Networking bridges (2026-03 batch)
alice-proxy = { path = "../ALICE-Proxy", default-features = false }
alice-websocket = { path = "../ALICE-WebSocket", default-features = false }
alice-grpc = { path = "../ALICE-gRPC", default-features = false }
alice-http = { path = "../ALICE-HTTP", default-features = false }

# Storage bridges (2026-03 batch)
alice-filesystem = { path = "../ALICE-FileSystem", default-features = false }
alice-objectstore = { path = "../ALICE-ObjectStore", default-features = false }

# Security bridges (2026-03 batch)
alice-waf = { path = "../ALICE-WAF", default-features = false }
alice-dlp = { path = "../ALICE-DLP", default-features = false }
alice-audit = { path = "../ALICE-Audit", default-features = false }

# AI/ML bridges (2026-03 batch)
alice-llm = { path = "../ALICE-LLM", default-features = false }
alice-gan = { path = "../ALICE-GAN", default-features = false }
alice-automl = { path = "../ALICE-AutoML", default-features = false }

# Swarm/IoT bridges (2026-03 batch)
alice-swarm = { path = "../ALICE-Swarm", default-features = false }
alice-ble = { path = "../ALICE-BLE", default-features = false }
alice-lora = { path = "../ALICE-LoRa", default-features = false }
alice-nfc = { path = "../ALICE-NFC", default-features = false }

# Infrastructure bridges (2026-03 batch)
alice-terraform = { path = "../ALICE-Terraform", default-features = false }
alice-monitor = { path = "../ALICE-Monitor", default-features = false }

# Science bridges (2026-03 batch)
alice-chemistry = { path = "../ALICE-Chemistry", default-features = false }
alice-optics = { path = "../ALICE-Optics", default-features = false }
alice-signal = { path = "../ALICE-Signal", default-features = false }

# Business bridges (2026-03 batch)
alice-crm = { path = "../ALICE-CRM", default-features = false }
alice-erp = { path = "../ALICE-ERP", default-features = false }
alice-hrm = { path = "../ALICE-HRM", default-features = false }
alice-lms = { path = "../ALICE-LMS", default-features = false }

# XR bridges (2026-03 batch)
alice-vr = { path = "../ALICE-VR", default-features = false }

# 2026-03 batch 2: AI/ML extended

# 2026-03 batch 2: Science extended

# 2026-03 batch 2: Financial extended

# 2026-03 batch 2: Media extended

# 2026-03 batch 2: Security extended

# 2026-03 batch 2: Networking extended

# 2026-03 batch 2: Data pipeline

# 2026-03 batch 2: DevTools

# 2026-03 batch 2: Application

# 2026-03 batch 2: Compute extended
alice-game-engine = { path = "../ALICE-GameEngine", default-features = false }

# 2026-03 batch 2: IoT extended

# 2026-03 batch 2: Cross-cutting

# Agent bridge (2026-04)
alice-agent = { path = "../ALICE-Agent", default-features = false }

# Serialization (in-memory ASDF, zero disk I/O)
bincode = "1"
crc32fast = "1"

# Utilities
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[lib]
name = "alice_eco_system"
path = "src/lib.rs"

[[bin]]
name = "alice-demo"
path = "src/main.rs"

[[example]]
name = "sdf_delivery"
path = "examples/sdf_delivery.rs"

[[example]]
name = "game_pipeline"
path = "examples/game_pipeline.rs"

[[bench]]
name = "bridge_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
