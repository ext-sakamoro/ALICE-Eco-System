[package]
name = "alice-eco-system"
version = "0.3.4"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Index of the public ALICE crates and the integration hub that connects them"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Eco-System"

[dependencies]
# ALICE Ecosystem (Python bindings disabled for integration demo)
alice-edge = { git = "https://github.com/ext-sakamoro/ALICE-Edge", branch = "main", version = "0.4", features = ["std"] }
alice-db = { git = "https://github.com/ext-sakamoro/ALICE-DB", branch = "main", version = "0.6", default-features = false }
libasp = { git = "https://github.com/ext-sakamoro/ALICE-Streaming-Protocol", branch = "main", version = "1", default-features = false }
alice-view = { git = "https://github.com/ext-sakamoro/ALICE-View", branch = "main", version = "0.3" }

# 3D Asset Delivery Pipeline
alice-sdf = { git = "https://github.com/ext-sakamoro/ALICE-SDF", branch = "main", version = "7", default-features = false, features = ["destruction"] }
alice-cdn = { git = "https://github.com/ext-sakamoro/ALICE-CDN", branch = "main", version = "0.2", features = ["content_types"] }
alice-cache = { git = "https://github.com/ext-sakamoro/ALICE-Cache", branch = "main", version = "0.2" }

# Game Engine Pipeline
alice-physics = { git = "https://github.com/ext-sakamoro/ALICE-Physics", branch = "main", version = "4" }
alice-sync = { git = "https://github.com/ext-sakamoro/ALICE-Sync", branch = "main", version = "0.8", features = ["telemetry"] }

# Crate bridges (Synth, VCS, Motion, RTOS, Kinematics, Font)
alice-synth = { git = "https://github.com/ext-sakamoro/ALICE-Synth", branch = "main", version = "0.2.0-dev", features = ["std"] }
alice-kinematics = { git = "https://github.com/ext-sakamoro/ALICE-Kinematics", branch = "main", version = "0.4", features = ["std", "encoder"] }
alice-motion = { git = "https://github.com/ext-sakamoro/ALICE-Motion", branch = "main", version = "0.1", features = ["std"] }
alice-rtos = { git = "https://github.com/ext-sakamoro/ALICE-RTOS", branch = "main", version = "0.1" }
alice-vcs = { git = "https://github.com/ext-sakamoro/ALICE-VCS", branch = "main", version = "0.2", features = ["std"] }

# Media & Text Processing bridges
alice-voice = { git = "https://github.com/ext-sakamoro/ALICE-Voice", branch = "main", version = "0.1", default-features = false, features = ["std"] }
alice-codec = { git = "https://github.com/ext-sakamoro/ALICE-Codec", branch = "main", version = "0.2", default-features = false, features = ["std"] }
alice-text = { git = "https://github.com/ext-sakamoro/ALICE-Text", branch = "main", version = "2", default-features = false }
alice-search = { git = "https://github.com/ext-sakamoro/ALICE-Search", branch = "main", version = "0.2", default-features = false, features = ["std"] }

# AI & GPU Inference bridges
alice-ml = { git = "https://github.com/ext-sakamoro/ALICE-ML", branch = "main", version = "0.4", default-features = false, features = ["std"] }
alice-trt = { git = "https://github.com/ext-sakamoro/ALICE-TRT", branch = "main", version = ">=3, <5", default-features = false }

# Network & Security bridges
alice-dns = { git = "https://github.com/ext-sakamoro/ALICE-DNS", branch = "main", version = "0.2", default-features = false }
alice-api = { git = "https://github.com/ext-sakamoro/ALICE-API", branch = "main", version = "0.2", default-features = false, features = ["std"] }
# the alice-zip sibling (lib name aliased to `alice_core` as used by bridge_zip.rs)
alice_core = { package = "alice-zip", git = "https://github.com/ext-sakamoro/ALICE-Zip", branch = "main", version = "0.11", default-features = false, features = ["std", "lzma"] }

# Auth & Crypto bridges
alice-auth = { git = "https://github.com/ext-sakamoro/ALICE-Auth", branch = "main", version = "0.6", default-features = false, features = ["std"] }
alice-crypto = { git = "https://github.com/ext-sakamoro/ALICE-Crypto", branch = "main", version = "0.7" }

# Content Creation bridges (Animation, Manga, Print) — Proprietary, optional

# Container & Commercial bridges
alice-container = { git = "https://github.com/ext-sakamoro/ALICE-Container", branch = "main", version = "0.3", default-features = false, features = ["std"] }

# Browser & Cloud Gateway bridges
alice-browser = { git = "https://github.com/ext-sakamoro/ALICE-Browser", branch = "main", version = "0.2", default-features = false }
alice-cloud-gateway = { git = "https://github.com/ext-sakamoro/ALICE-Cloud-Gateway", branch = "main", version = "0.1", default-features = false }

# Firewall bridge (Linux only — depends on nfq/netfilter)

# Tokenizer bridge
alice-token = { git = "https://github.com/ext-sakamoro/ALICE-Token", branch = "main", version = "1" }

# Semantic Telemetry bridge

# Training bridge
alice-train = { git = "https://github.com/ext-sakamoro/ALICE-Train", branch = "main", version = "0.3" }

# Telemetry & Messaging bridges
alice-analytics = { git = "https://github.com/ext-sakamoro/ALICE-Analytics", branch = "main", version = "0.7", default-features = false, features = ["std"] }
alice-queue = { git = "https://github.com/ext-sakamoro/ALICE-Queue", branch = "main", version = "0.2" }

# Financial domain bridges
alice-ledger = { git = "https://github.com/ext-sakamoro/ALICE-Ledger", branch = "main", version = "0.3" }
alice-risk = { git = "https://github.com/ext-sakamoro/ALICE-Risk", branch = "main", version = "0.2" }
alice-fix = { git = "https://github.com/ext-sakamoro/ALICE-FIX", branch = "main", version = "0.2" }
alice-settlement = { git = "https://github.com/ext-sakamoro/ALICE-Settlement", branch = "main", version = "0.2" }

# Science & Domain-Specific bridges (Path L-Q)
alice-bio = { git = "https://github.com/ext-sakamoro/ALICE-Bio", branch = "main", version = "0.2" }
alice-legal = { git = "https://github.com/ext-sakamoro/ALICE-Legal", branch = "main", version = "0.3" }
alice-energy = { git = "https://github.com/ext-sakamoro/ALICE-Energy", branch = "main", version = "0.1" }
alice-space = { git = "https://github.com/ext-sakamoro/ALICE-Space", branch = "main", version = "0.8" }
alice-climate = { git = "https://github.com/ext-sakamoro/ALICE-Climate", branch = "main", version = "0.1" }

# Advanced domain bridges (Path R-U)
alice-history = { git = "https://github.com/ext-sakamoro/ALICE-History", branch = "main", version = "0.1" }
alice-presence = { git = "https://github.com/ext-sakamoro/ALICE-Presence", branch = "main", version = "0.2" }

# Hardware bridge
alice-bridge = { git = "https://github.com/ext-sakamoro/ALICE-Bridge", branch = "main", version = "0.2" }

# Infrastructure bridges

# Data/Communication bridges

# Security bridges
alice-browser-secure = { git = "https://github.com/ext-sakamoro/ALICE-Browser-Secure", branch = "main", version = "0.1", default-features = false }
alice-datashield = { git = "https://github.com/ext-sakamoro/ALICE-DataShield", branch = "main", version = "0.2", default-features = false }

# Analytics/Monitoring bridges

# Domain bridges
alice-legal-ai = { git = "https://github.com/ext-sakamoro/ALICE-Legal-AI", branch = "main", version = "0.1", default-features = false }

# Media/Compression/Low-level bridges
alice-text-compression = { git = "https://github.com/ext-sakamoro/ALICE-Text-Compression", branch = "main", version = "0.1", default-features = false }

# Enterprise/Commercial bridges
alice-simd = { git = "https://github.com/ext-sakamoro/ALICE-SIMD", branch = "main", version = "1", default-features = false, features = ["std"] }

# Media bridges (2026-03 batch)
alice-audio = { git = "https://github.com/ext-sakamoro/ALICE-Audio", branch = "main", version = "2", default-features = false }
alice-video = { git = "https://github.com/ext-sakamoro/ALICE-Video", branch = "main", version = "1", default-features = false }
alice-camera = { git = "https://github.com/ext-sakamoro/ALICE-Camera", branch = "main", version = "1", default-features = false }

# Spatial bridges (2026-03 batch)
alice-navigation = { git = "https://github.com/ext-sakamoro/ALICE-Navigation", branch = "main", version = "1", default-features = false }

# Optimization bridges (2026-03 batch)

# Real-time bridges (2026-03 batch)

# Compiler/Language bridges (2026-03 batch)
alice-compiler = { git = "https://github.com/ext-sakamoro/ALICE-Compiler", branch = "main", version = "2", default-features = false }
alice-vm = { git = "https://github.com/ext-sakamoro/ALICE-VM", branch = "main", version = "1", default-features = false }
alice-parser = { git = "https://github.com/ext-sakamoro/ALICE-Parser", branch = "main", version = "1", default-features = false }

# Networking bridges (2026-03 batch)
alice-proxy = { git = "https://github.com/ext-sakamoro/ALICE-Proxy", branch = "main", version = "1", default-features = false }
alice-websocket = { git = "https://github.com/ext-sakamoro/ALICE-WebSocket", branch = "main", version = "1", default-features = false }
alice-grpc = { git = "https://github.com/ext-sakamoro/ALICE-gRPC", branch = "main", version = "1", default-features = false }
alice-http = { git = "https://github.com/ext-sakamoro/ALICE-HTTP", branch = "main", version = "1", default-features = false }

# Storage bridges (2026-03 batch)
alice-filesystem = { git = "https://github.com/ext-sakamoro/ALICE-FileSystem", branch = "main", version = "1", default-features = false }
alice-objectstore = { git = "https://github.com/ext-sakamoro/ALICE-ObjectStore", branch = "main", version = "1", default-features = false }

# Security bridges (2026-03 batch)
alice-waf = { git = "https://github.com/ext-sakamoro/ALICE-WAF", branch = "main", version = "1", default-features = false }
alice-dlp = { git = "https://github.com/ext-sakamoro/ALICE-DLP", branch = "main", version = "1", default-features = false }
alice-audit = { git = "https://github.com/ext-sakamoro/ALICE-Audit", branch = "main", version = "1", default-features = false }

# AI/ML bridges (2026-03 batch)
alice-llm = { git = "https://github.com/ext-sakamoro/ALICE-LLM", branch = "main", version = "4", default-features = false }
alice-gan = { git = "https://github.com/ext-sakamoro/ALICE-GAN", branch = "main", version = "1", default-features = false }
alice-automl = { git = "https://github.com/ext-sakamoro/ALICE-AutoML", branch = "main", version = "1", default-features = false }

# Swarm/IoT bridges (2026-03 batch)
alice-swarm = { git = "https://github.com/ext-sakamoro/ALICE-Swarm", branch = "main", version = "1", default-features = false }
alice-ble = { git = "https://github.com/ext-sakamoro/ALICE-BLE", branch = "main", version = "1", default-features = false }
alice-lora = { git = "https://github.com/ext-sakamoro/ALICE-LoRa", branch = "main", version = "1", default-features = false }
alice-nfc = { git = "https://github.com/ext-sakamoro/ALICE-NFC", branch = "main", version = "1", default-features = false }

# Infrastructure bridges (2026-03 batch)
alice-terraform = { git = "https://github.com/ext-sakamoro/ALICE-Terraform", branch = "main", version = "1", default-features = false }
alice-monitor = { git = "https://github.com/ext-sakamoro/ALICE-Monitor", branch = "main", version = "1", default-features = false }

# Science bridges (2026-03 batch)
alice-chemistry = { git = "https://github.com/ext-sakamoro/ALICE-Chemistry", branch = "main", version = "1", default-features = false }
alice-optics = { git = "https://github.com/ext-sakamoro/ALICE-Optics", branch = "main", version = "1", default-features = false }
alice-signal = { git = "https://github.com/ext-sakamoro/ALICE-Signal", branch = "main", version = "1", default-features = false }

# Business bridges (2026-03 batch)
alice-crm = { git = "https://github.com/ext-sakamoro/ALICE-CRM", branch = "main", version = "1", default-features = false }
alice-erp = { git = "https://github.com/ext-sakamoro/ALICE-ERP", branch = "main", version = "1", default-features = false }
alice-hrm = { git = "https://github.com/ext-sakamoro/ALICE-HRM", branch = "main", version = "1", default-features = false }
alice-lms = { git = "https://github.com/ext-sakamoro/ALICE-LMS", branch = "main", version = "1", default-features = false }

# XR bridges (2026-03 batch)
alice-vr = { git = "https://github.com/ext-sakamoro/ALICE-VR", branch = "main", version = "1", default-features = false }

# 2026-03 batch 2: AI/ML extended

# 2026-03 batch 2: Science extended

# 2026-03 batch 2: Financial extended

# 2026-03 batch 2: Media extended

# 2026-03 batch 2: Security extended

# 2026-03 batch 2: Networking extended

# 2026-03 batch 2: Data pipeline

# 2026-03 batch 2: DevTools

# 2026-03 batch 2: Application

# 2026-03 batch 2: Compute extended
alice-game-engine = { git = "https://github.com/ext-sakamoro/ALICE-GameEngine", branch = "main", version = "0.6", default-features = false }

# 2026-03 batch 2: IoT extended

# 2026-03 batch 2: Cross-cutting

# Agent bridge (2026-04)
alice-agent = { git = "https://github.com/ext-sakamoro/ALICE-Agent", branch = "main", version = "0.1", default-features = false }

# Serialization (in-memory ASDF, zero disk I/O)
bincode = "1"
crc32fast = "1"

# Utilities
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[lib]
name = "alice_eco_system"
path = "src/lib.rs"

[[bin]]
name = "alice-demo"
path = "src/main.rs"

[[example]]
name = "sdf_delivery"
path = "examples/sdf_delivery.rs"

[[example]]
name = "game_pipeline"
path = "examples/game_pipeline.rs"

[[bench]]
name = "bridge_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
