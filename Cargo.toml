[package]
name = "alice-eco-system"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "ALICE Ecosystem Integration Hub - 144+ bridges, 6 pipeline paths (IoT/Game/MoCap/Anime/Embedded/Print)"
license = "MIT"
repository = "https://github.com/ext-sakamoro/ALICE-Eco-System"

[dependencies]
# ALICE Ecosystem (Python bindings disabled for integration demo)
alice-edge = { path = "../ALICE-Edge", features = ["std"] }
alice-db = { path = "../ALICE-DB", default-features = false }
libasp = { path = "../ALICE-Streaming-Protocol", default-features = false }
alice-view = { path = "../ALICE-View" }

# 3D Asset Delivery Pipeline
alice-sdf = { path = "../ALICE-SDF", default-features = false }
alice-cdn = { path = "../ALICE-CDN", features = ["content_types"] }
alice-cache = { path = "../ALICE-Cache" }

# Game Engine Pipeline
alice-physics = { path = "../ALICE-Physics", features = ["replay"] }
alice-sync = { path = "../ALICE-Sync", features = ["telemetry"] }

# New crate bridges (Synth, VCS, Motion, RTOS, Kinematics, Font)
alice-font = { path = "../ALICE-Font", features = ["std"] }
alice-synth = { path = "../ALICE-Synth", features = ["std"] }
alice-kinematics = { path = "../ALICE-Kinematics", features = ["std", "encoder"] }
alice-motion = { path = "../ALICE-Motion", features = ["std"] }
alice-rtos = { path = "../ALICE-RTOS" }
alice-vcs = { path = "../ALICE-VCS", features = ["std"] }

# Serialization (in-memory ASDF, zero disk I/O)
bincode = "1"
crc32fast = "1"

# Utilities
tempfile = "3"

[lib]
name = "alice_eco_system"
path = "src/lib.rs"

[[bin]]
name = "alice-demo"
path = "src/main.rs"

[[example]]
name = "sdf_delivery"
path = "examples/sdf_delivery.rs"

[[example]]
name = "game_pipeline"
path = "examples/game_pipeline.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
