[package]
name = "alice-eco-system"
version = "0.3.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "ALICE Ecosystem Integration Hub - 255 bridges, 11 pipeline paths (A-K), 41 bridge modules, 42 crates"
license = "MIT"
repository = "https://github.com/ext-sakamoro/ALICE-Eco-System"

[dependencies]
# ALICE Ecosystem (Python bindings disabled for integration demo)
alice-edge = { path = "../ALICE-Edge", features = ["std"] }
alice-db = { path = "../ALICE-DB", default-features = false }
libasp = { path = "../ALICE-Streaming-Protocol", default-features = false }
alice-view = { path = "../ALICE-View" }

# 3D Asset Delivery Pipeline
alice-sdf = { path = "../ALICE-SDF", default-features = false }
alice-cdn = { path = "../ALICE-CDN", features = ["content_types"] }
alice-cache = { path = "../ALICE-Cache" }

# Game Engine Pipeline
alice-physics = { path = "../ALICE-Physics", features = ["replay"] }
alice-sync = { path = "../ALICE-Sync", features = ["telemetry"] }

# Crate bridges (Synth, VCS, Motion, RTOS, Kinematics, Font)
alice-font = { path = "../ALICE-Font", features = ["std"] }
alice-synth = { path = "../ALICE-Synth", features = ["std"] }
alice-kinematics = { path = "../ALICE-Kinematics", features = ["std", "encoder"] }
alice-motion = { path = "../ALICE-Motion", features = ["std"] }
alice-rtos = { path = "../ALICE-RTOS" }
alice-vcs = { path = "../ALICE-VCS", features = ["std"] }

# Media & Text Processing bridges
alice-voice = { path = "../ALICE-Voice", default-features = false, features = ["std"] }
alice-codec = { path = "../ALICE-Codec", default-features = false, features = ["std"] }
alice-text = { path = "../ALICE-Text", default-features = false }
alice-search = { path = "../ALICE-Search", default-features = false, features = ["std"] }

# AI & GPU Inference bridges
alice-ml = { path = "../ALICE-ML", default-features = false, features = ["std"] }
alice-trt = { path = "../ALICE-TRT", default-features = false }

# Network & Security bridges
alice-dns = { path = "../ALICE-DNS", default-features = false }
alice-api = { path = "../ALICE-API", default-features = false, features = ["std"] }
alice-zip = { path = "../ALICE-Zip/libalice", default-features = false }

# Auth & Crypto bridges
alice-auth = { path = "../ALICE-Auth", default-features = false, features = ["std"] }
alice-crypto = { path = "../ALICE-Crypto" }

# Content Creation bridges (Animation, Manga, Print) — Proprietary, optional
alice-animation = { path = "../ALICE-Animation", default-features = false, optional = true }
alice-manga = { path = "../ALICE-Manga", default-features = false, optional = true }
alice-print = { path = "../ALICE-Print", default-features = false, optional = true }

# Container & Commercial bridges
alice-container = { path = "../ALICE-Container", default-features = false, features = ["std"] }
alice-streaming-protocol-commercial = { path = "../ALICE-Streaming-Protocol-Commercial", package = "libasp-enterprise", optional = true, default-features = false }
alice-edge-commercial = { path = "../ALICE-Edge-Commercial", package = "alice-edge-enterprise", optional = true, default-features = false }

# Browser & Cloud Gateway bridges
alice-browser = { path = "../ALICE-Browser", default-features = false }
alice-cloud-gateway = { path = "../ALICE-Cloud-Gateway", default-features = false }

# Firewall bridge (Linux only — depends on nfq/netfilter)
alice-edge-firewall = { path = "../ALICE-Edge-Firewall", default-features = false, optional = true }

# Semantic Telemetry bridge
alice-semantic-telemetry = { path = "../ALICE-Semantic-Telemetry" }

# Telemetry & Messaging bridges
alice-analytics = { path = "../ALICE-Analytics", default-features = false, features = ["std"] }
alice-queue = { path = "../ALICE-Queue" }

# Financial domain bridges
alice-ledger = { path = "../ALICE-Ledger" }
alice-risk = { path = "../ALICE-Risk" }
alice-fix = { path = "../ALICE-FIX" }
alice-settlement = { path = "../ALICE-Settlement" }

# Serialization (in-memory ASDF, zero disk I/O)
bincode = "1"
crc32fast = "1"

# Utilities
tempfile = "3"

[lib]
name = "alice_eco_system"
path = "src/lib.rs"

[[bin]]
name = "alice-demo"
path = "src/main.rs"

[[example]]
name = "sdf_delivery"
path = "examples/sdf_delivery.rs"

[[example]]
name = "game_pipeline"
path = "examples/game_pipeline.rs"

[features]
default = []
animation = ["dep:alice-animation"]
manga = ["dep:alice-manga"]
print = ["dep:alice-print"]
content-creation = ["animation", "manga", "print"]
firewall = ["dep:alice-edge-firewall"]
edge-commercial = ["dep:alice-edge-commercial"]
streaming-protocol-commercial = ["dep:alice-streaming-protocol-commercial"]
enterprise = ["edge-commercial", "streaming-protocol-commercial"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
